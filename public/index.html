<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<link rel="manifest" href="/manifest.json">
<title>Маршрут на завтра</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#16181d; --muted:#6b7280; --accent:#1f6feb; --bad:#d92d20; --warn:#b54708; --ok:#067647; --line:#e5e7eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#181b22; --text:#e8eaed; --muted:#9aa3b2; --line:#2a2f3a; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--text); padding-bottom:64px; }
  header { padding:12px 16px; font-weight:600; display:flex; justify-content:space-between; align-items:center; }
  main { padding:0 16px 16px; max-width:720px; margin:auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; }
  label { display:block; font-size:13px; color:var(--muted); margin:8px 0 2px; }
  input, select, button { font:inherit; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); width:100%; }
  button { background:var(--accent); color:#fff; border:0; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button:disabled { opacity:.5; }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  #map { height:300px; border-radius:12px; margin-bottom:12px; }
  nav { position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--card); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
  nav button { background:none; color:var(--muted); border:0; border-radius:0; padding:14px 4px; }
  nav button.active { color:var(--accent); }
  .stop { display:flex; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
  .stop:last-child { border:0; }
  .num { min-width:30px; height:30px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; font-weight:700; }
  .muted { color:var(--muted); font-size:14px; }
  .warn { color:var(--warn); } .bad { color:var(--bad); } .ok { color:var(--ok); }
  .hidden { display:none; }
  .chk { display:flex; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
  .chk input { width:22px; height:22px; flex:none; }
</style>
</head>
<body>
<header><span>🚚 Маршрут на завтра</span><span id="who" class="muted"></span></header>
<main>

  <section id="view-login" class="hidden card">
    <label>Email</label><input id="email" type="email" autocomplete="username">
    <label>Пароль</label><input id="password" type="password" autocomplete="current-password">
    <div class="row" style="margin-top:12px"><button id="btn-login">Войти</button><button id="btn-signup" class="ghost">Регистрация</button></div>
    <p id="login-msg" class="muted"></p>
  </section>

  <section id="view-plan" class="hidden">
    <div class="card">
      <label>Склад (откуда выезжаем)</label>
      <div class="row"><input id="depot-text" placeholder="Адрес склада"><button id="btn-depot" class="ghost" style="flex:0 0 110px">Найти</button></div>
      <div id="depot-info" class="muted"></div>
      <div class="row">
        <div><label>Масса машины, кг</label><input id="v-weight" type="number" placeholder="например 3500"></div>
        <div><label>Высота, м</label><input id="v-height" type="number" step="0.1" placeholder="2.8"></div>
      </div>
      <div class="row">
        <div><label>Платные дороги</label>
          <select id="tolls"><option value="auto">Выбрать выгоднее</option><option value="always">Всегда объезжать</option><option value="never">Разрешены</option></select></div>
        <div><label>Вернуться на склад</label>
          <select id="ret"><option value="1">Да</option><option value="0">Нет</option></select></div>
      </div>
      <div class="row">
        <div><label>₽ за час работы</label><input id="v-hour" type="number" value="600"></div>
        <div><label>₽ за км</label><input id="v-km" type="number" value="18"></div>
      </div>
    </div>

    <div class="card">
      <b>Клиенты на завтра</b>
      <div id="client-checks" class="muted">Загрузка…</div>
      <button id="btn-optimize" style="margin-top:12px">Построить лучший маршрут</button>
      <p id="plan-msg" class="muted"></p>
    </div>

    <div id="result" class="hidden">
      <div id="map"></div>
      <div class="card" id="summary"></div>
      <div class="card" id="warnings"></div>
      <div class="card" id="ordered"></div>
      <a id="yandex" target="_blank" rel="noopener"><button style="margin-bottom:12px">Открыть в Яндекс Картах</button></a>
      <button id="btn-save" class="ghost">Сохранить рейс</button>
    </div>
  </section>

  <section id="view-clients" class="hidden">
    <div class="card">
      <label>Название</label><input id="c-name">
      <div class="row">
        <div><label>Тип</label><select id="c-kind"><option>ООО</option><option>ИП</option></select></div>
        <div><label>Разгрузка, мин</label><input id="c-unload" type="number" value="15"></div>
      </div>
      <label>Адрес</label>
      <div class="row"><input id="c-addr"><button id="btn-find" class="ghost" style="flex:0 0 110px">Найти</button></div>
      <select id="c-candidates" class="hidden" style="margin-top:8px"></select>
      <div id="c-coords" class="muted"></div>
      <button id="btn-add-client" style="margin-top:12px">Добавить клиента</button>
      <p id="c-msg" class="muted"></p>
    </div>
    <div class="card" id="clients-list"></div>
  </section>

  <section id="view-hazards" class="hidden">
    <div class="card">
      <b>Отметить на карте</b>
      <p class="muted">Нажмите на карту в нужном месте и выберите тип.</p>
      <select id="h-type">
        <option value="bad_road">Плохая дорога (маршрут будет обходить)</option>
        <option value="weigh_post">Весовой контроль</option>
        <option value="toll">Платный участок</option>
      </select>
      <label>Название / комментарий</label><input id="h-title" placeholder="Например: яма на въезде в посёлок">
      <label>Стоимость проезда, ₽ (только для платных)</label><input id="h-price" type="number">
      <button id="btn-add-hazard" style="margin-top:12px" disabled>Сначала нажмите на карту</button>
      <p id="h-msg" class="muted"></p>
    </div>
    <div id="map-h" style="height:340px;border-radius:12px;margin-bottom:12px"></div>
    <div class="card" id="hazards-list"></div>
  </section>
</main>

<nav id="nav" class="hidden">
  <button data-v="plan" class="active">Маршрут</button>
  <button data-v="clients">Клиенты</button>
  <button data-v="hazards">Опасные точки</button>
  <button id="btn-logout">Выйти</button>
</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/app.js"></script>
</body>
</html>
