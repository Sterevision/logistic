<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1f6feb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Маршрут</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#f2f4f7; --card:#fff; --text:#101828; --muted:#667085; --accent:#1f6feb; --bad:#d92d20; --warn:#b54708; --ok:#067647; --line:#e4e7ec; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0c0e12; --card:#171a21; --text:#eef0f3; --muted:#98a2b3; --line:#2a2f3a; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; overscroll-behavior:none; }
  body { font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text);
         padding-bottom:calc(76px + env(safe-area-inset-bottom)); -webkit-user-select:none; user-select:none; }
  input, select { -webkit-user-select:text; user-select:text; }
  header { position:sticky; top:0; z-index:500; background:var(--accent); color:#fff; padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
           display:flex; align-items:center; justify-content:space-between; gap:8px; }
  header b { font-size:18px; }
  header button { width:auto; padding:6px 12px; background:rgba(255,255,255,.2); border-radius:18px; font-size:14px; }
  main { padding:12px 16px; max-width:720px; margin:auto; }
  h2 { font-size:15px; margin:0 0 8px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
  .card { background:var(--card); border-radius:16px; padding:14px; margin-bottom:12px; box-shadow:0 1px 2px rgba(16,24,40,.06); }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  input, select, button { font:inherit; min-height:48px; padding:10px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--text); width:100%; }
  button { background:var(--accent); color:#fff; border:0; font-weight:600; cursor:pointer; transition:transform .08s; }
  button:active { transform:scale(.97); }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button.big { min-height:56px; font-size:18px; border-radius:16px; }
  button.small { min-height:36px; padding:4px 12px; width:auto; font-size:14px; }
  button:disabled { opacity:.45; }
  .row { display:flex; gap:8px; } .row > * { flex:1; min-width:0; }
  #map { height:300px; border-radius:16px; margin-bottom:12px; }
  nav { position:fixed; bottom:0; left:0; right:0; z-index:600; display:flex; background:var(--card); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
  nav button { background:none; color:var(--muted); border-radius:0; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:12px; padding:8px 4px; min-height:60px; border:0; }
  nav button span { font-size:22px; line-height:1; }
  nav button.active { color:var(--accent); }
  .stop { display:flex; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .stop:last-child { border:0; }
  .grow { flex:1; min-width:0; }
  .num { min-width:34px; height:34px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; font-weight:700; }
  .muted { color:var(--muted); font-size:14px; }
  .warn { color:var(--warn); } .bad { color:var(--bad); } .ok { color:var(--ok); }
  .hidden { display:none !important; }
  .chk { display:flex; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); margin:0; color:var(--text); font-size:16px; }
  .chk:last-child { border:0; }
  .chk input { width:26px; height:26px; min-height:0; flex:none; }
  details summary { cursor:pointer; font-weight:600; padding:6px 0; }
  .summary-big { font-size:22px; font-weight:700; }
  #pick { position:fixed; inset:0; z-index:1000; background:var(--bg); display:flex; flex-direction:column; }
  #pick-map { flex:1; }
  #pick .bar { padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:var(--card); display:flex; flex-direction:column; gap:8px; }
</style>
</head>
<body>
<header>
  <b>🚚 Маршрут</b>
  <span style="display:flex;gap:8px;align-items:center">
    <button id="btn-install" class="hidden">Установить</button>
    <button id="btn-logout" class="hidden">Выйти</button>
  </span>
</header>

<main>
  <!-- ВХОД -->
  <section id="view-login" class="hidden">
    <div class="card">
      <label>Email</label><input id="email" type="email" autocomplete="username">
      <label>Пароль</label><input id="password" type="password" autocomplete="current-password">
      <div class="row" style="margin-top:14px"><button id="btn-login">Войти</button><button id="btn-signup" class="ghost">Регистрация</button></div>
      <p id="login-msg" class="muted"></p>
    </div>
  </section>

  <!-- МАРШРУТ -->
  <section id="view-plan" class="hidden">
    <div class="card">
      <h2>Склад</h2>
      <div id="depot-view" class="row" style="align-items:center">
        <span id="depot-info" class="grow muted"></span>
        <button id="btn-depot-edit" class="ghost small" style="flex:0 0 auto">Изменить</button>
      </div>
      <div id="depot-edit" class="hidden">
        <input id="depot-text" placeholder="Город, улица, дом склада">
        <div class="row" style="margin-top:8px"><button id="btn-depot">Найти</button><button id="btn-depot-pick" class="ghost">На карте</button></div>
        <select id="depot-cands" class="hidden" style="margin-top:8px"></select>
      </div>
    </div>

    <div class="card">
      <h2>Клиенты на завтра</h2>
      <div class="row" style="margin-bottom:6px"><button id="btn-all" class="ghost small">Выбрать всех</button><button id="btn-none" class="ghost small">Снять все</button></div>
      <div id="client-checks" class="muted">Загрузка…</div>
    </div>

    <div class="card">
      <details>
        <summary>Настройки машины и расчёта</summary>
        <div class="row">
          <div><label>Масса, кг</label><input id="v-weight" type="number" inputmode="numeric" placeholder="3500"></div>
          <div><label>Высота, м</label><input id="v-height" type="number" inputmode="decimal" step="0.1" placeholder="2.8"></div>
        </div>
        <label>Платные дороги</label>
        <select id="tolls"><option value="auto">Выбрать выгоднее</option><option value="always">Всегда объезжать</option><option value="never">Разрешены</option></select>
        <label>Вернуться на склад</label>
        <select id="ret"><option value="1">Да</option><option value="0">Нет</option></select>
        <div class="row">
          <div><label>₽ за час</label><input id="v-hour" type="number" inputmode="numeric" value="600"></div>
          <div><label>₽ за км</label><input id="v-km" type="number" inputmode="numeric" value="18"></div>
        </div>
      </details>
    </div>

    <button id="btn-optimize" class="big">Построить маршрут</button>
    <p id="plan-msg" class="muted"></p>

    <div id="result" class="hidden" style="margin-top:12px">
      <div class="card"><div id="summary"></div></div>
      <div id="map"></div>
      <div class="card" id="warnings"></div>
      <div class="card" id="ordered"></div>
      <a id="yandex" target="_blank" rel="noopener" style="text-decoration:none"><button class="big" style="margin-bottom:10px">Поехали (Яндекс Карты)</button></a>
      <button id="btn-save" class="ghost">Сохранить рейс</button>
    </div>
  </section>

  <!-- КЛИЕНТЫ -->
  <section id="view-clients" class="hidden">
    <div class="card">
      <h2>Новый клиент</h2>
      <label>Название</label><input id="c-name" placeholder="ООО «Ромашка» / ИП Иванов">
      <div class="row">
        <div><label>Тип</label><select id="c-kind"><option>ООО</option><option>ИП</option></select></div>
        <div><label>Разгрузка, мин</label><input id="c-unload" type="number" inputmode="numeric" value="15"></div>
      </div>
      <label>Адрес (с городом или посёлком)</label>
      <input id="c-addr" placeholder="Уфа, ул. Ленина, 1">
      <div class="row" style="margin-top:8px"><button id="btn-find">Найти адрес</button><button id="btn-pick-new" class="ghost">Указать на карте</button></div>
      <select id="c-candidates" class="hidden" style="margin-top:8px"></select>
      <div id="c-coords" class="muted" style="margin-top:8px"></div>
      <button id="btn-add-client" class="big" style="margin-top:12px">Добавить клиента</button>
      <p id="c-msg" class="muted"></p>
    </div>
    <div class="card"><h2>Все клиенты</h2><div id="clients-list"></div></div>
  </section>

  <!-- ОПАСНЫЕ ТОЧКИ -->
  <section id="view-hazards" class="hidden">
    <div class="card">
      <h2>Отметить на карте</h2>
      <p class="muted" style="margin:0 0 8px">Нажмите на карту в нужном месте.</p>
      <select id="h-type">
        <option value="bad_road">🕳️ Плохая дорога (будем объезжать)</option>
        <option value="weigh_post">⚖️ Весовой контроль</option>
        <option value="toll">💰 Платный участок</option>
      </select>
      <label>Комментарий</label><input id="h-title" placeholder="Например: яма на въезде">
      <label>Стоимость проезда, ₽ (для платных)</label><input id="h-price" type="number" inputmode="numeric">
      <button id="btn-add-hazard" class="big" style="margin-top:12px" disabled>Сначала нажмите на карту</button>
      <p id="h-msg" class="muted"></p>
    </div>
    <div id="map-h" style="height:340px;border-radius:16px;margin-bottom:12px"></div>
    <div class="card"><h2>Все отметки</h2><div id="hazards-list"></div></div>
  </section>
</main>

<!-- ВЫБОР ТОЧКИ НА КАРТЕ -->
<div id="pick" class="hidden">
  <div id="pick-map"></div>
  <div class="bar">
    <div id="pick-hint" class="muted">Нажмите на карту, где находится точка</div>
    <button id="pick-gps" class="ghost">📍 Я здесь</button>
    <div class="row"><button id="pick-cancel" class="ghost">Отмена</button><button id="pick-ok" disabled>Готово</button></div>
  </div>
</div>

<nav id="nav" class="hidden">
  <button data-v="plan" class="active"><span>🚚</span>Маршрут</button>
  <button data-v="clients"><span>👥</span>Клиенты</button>
  <button data-v="hazards"><span>⚠️</span>Дороги</button>
</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/app.js"></script>
</body>
</html>
